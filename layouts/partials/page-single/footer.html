{{ $include_toc := .Params.include_toc}}
{{ partial "footer/font-awesome-js.html" . }}
{{ with .Site.Params.toc }}
{{ if and (eq . "tocbot") (ne $include_toc false) }}
<script defer src="{{ "js/tocbot.min.js" | relURL }}"></script>
<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    if (window.tocbot) {
    tocbot.init({
      // Where to render the table of contents.
      tocSelector: '.toc',
      // Where to grab the headings to build the table of contents.
      contentSelector: '.post',
      // Which headings to grab inside of the contentSelector element.
      headingSelector: 'h2, h3, h4',
      collapseDepth: 4
    });
    }
  });
</script>
{{ end }}
{{ end }}

{{ if not .Params.noZoom }}
<script defer src="{{ "js/medium-zoom.min.js" | relURL }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    mediumZoom('.post img', {
      background: 'rgba(0,0,0,0.82)',
      margin: 24,
      scrollOffset: 0
    });
  });
</script>
{{ end }}
